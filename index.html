<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="content">
        <div class="left">
            <div class="nen_icon">
                <div class="icon">
                    <img src="./Anh/element-4.svg">
                </div>
            </div>
            <div class="wrap-icon-bottom">
                <div class="icon"><img src="./Anh/graph.svg" ></div>
                <div class="icon"><img src="./Anh/medal-star.svg" ></div>
                <div class="icon"><img src="./Anh/comment.svg"></div>
                <div class="icon"><img src="./Anh/setting-2.svg"></div>
            </div>
        </div>
        <div class="right">
            <header>
                <div class="text">
                    <div class="Welcome">Welcome, Amanda</div>
                    <div class="day">Tue, 07 June 2022</div>
                </div>
                
                <div class="right-header">
                    <div class="input">
                        <div class="kinh_lup">
                            <img src="./Anh/kinh_lup.svg">
                        </div>
                        <input type="text" class="search" placeholder="Search" >
                    </div>
    
                    <div class="chuong">
                        <img src="./Anh/chuong.svg">
                    </div>
                    <div class="avatar">
                        <img src="./Anh/avatar.svg" >
                    </div>
                </div>
            </header>
            <footer>
                <div class="selection">
                    <img src="./Anh/selection.svg">
                </div>
                <div class="information">
                    <div class="table1">
                        <div class="avatar2">
                            <img src="./Anh/08f8792cc4560e6955e1cf3aa9aa4edfe7cc29bf.png">
                            <div class="information2">
                                <div class="alexa">Alexa Rawles</div>
                                <div class="alexa_emai">alexarawles@gmail.com</div>
                            </div>
                        </div>
                        <div class="edit">Edit</div>
                    </div>


                    <div class="wrap-input-section">
                        <div class="wrap-input">
                            <div class="label">Full Name</div>
                            <div class="input-item">Your First Name</div>
                        </div>
                        <div class="wrap-input">
                            <div class="label">Nick Name</div>
                            <div class="input-item">Your Nick Name</div>
                        </div>
                        <div class="wrap-input">
                            <div class="label">Gender</div>
                            <div class="input-item">Your Gender<div class="arrow-down"><img src="./Anh/dropDown_icon.svg" alt=""></div></div>
                        </div>
                        <div class="wrap-input">
                            <div class="label">Country</div>
                            <div class="input-item">Your Country<div class="arrow-down"><img src="./Anh/dropDown_icon.svg" alt=""></div></div>
                        </div>
                        <div class="wrap-input">
                            <div class="label">Language</div>
                            <div class="input-item">Your Language<div class="arrow-down"><img src="./Anh/dropDown_icon.svg" alt=""></div></div>
                        </div>
                        <div class="wrap-input">
                            <div class="label">Time Zone</div>
                            <div class="input-item">Your Time Zone<div class="arrow-down"><img src="./Anh/dropDown_icon.svg" alt=""></div></div>
                        </div>
                    </div>

                    <div class="end">
                        <div class="wrap-email">My email Address</div>
                        <div class="wrap-body">
                            <div class="email-icon"> 
                                <img src="/Anh/sms.svg"> 
                            </div>
                            <div class="email-time">
                                <div class="email-user">alexarawles@gmail.com</div>
                                <div class="time">1 month ago</div>
                            </div>
                        </div>
                        <div class="add"><div class="add-email">+Add Email Address</div></div>
                    </div>

                    
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
